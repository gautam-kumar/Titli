name: Titli
options:
  bundleIdPrefix: com.gautamkumar
  deploymentTarget:
    iOS: "17.0"
packages:
  TitliCore:
    path: TitliCore
targets:
  Titli:
    type: application
    platform: iOS
    sources:
      - path: Titli
    dependencies:
      - package: TitliCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gautamkumar.titli
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_CFBundleDisplayName: Titli
    info:
      path: Titli/Info.plist
      properties:
        CFBundleDisplayName: Titli
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - Sora-ExtraLight.ttf
          - Sora-Regular.ttf
          - Sora-Medium.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - PlusJakartaSans-ExtraBold.ttf
        NSMicrophoneUsageDescription: "Titli aapki baat sunkar yaad rakhti hai. (Titli listens so it can remember what you say.)"
        NSCameraUsageDescription: "Kaagaz ki photo kheenchne ke liye. Photo sirf aapke phone mein rehti hai. (To photograph papers. Photos stay on your phone.)"
        NSSpeechRecognitionUsageDescription: "Aapki awaaz ko likhne ke liye. (To turn your voice into text.)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [whatsapp]
schemes:
  Titli:
    build:
      targets:
        Titli: all
    run:
      config: Debug
