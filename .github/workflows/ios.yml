name: iOS

on:
  push:
    branches: [main, ios, attach]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Test Hindi/Hinglish understanding
        working-directory: ios/TitliCore
        run: swift test

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[(k,v) for k,v in d.items() if "iOS" in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split("iOS-")[-1].split("-")])
          for k,v in reversed(ios):
              for name in ("iPhone 16 Pro","iPhone 16","iPhone 15 Pro"):
                  for dev in v:
                      if dev["name"]==name: print(dev["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Titli.xcodeproj -scheme Titli -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screenshots
        working-directory: ios
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          APP=$(find build/Build/Products -name "Titli.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { # name, then launch arguments
            local name=$1; shift
            xcrun simctl terminate "$UDID" com.gautamkumar.titli || true
            xcrun simctl launch "$UDID" com.gautamkumar.titli -reset -quiet "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          for s in home listen saved answer doc themes attach attached; do shot $s -theme neel -screen $s; done
          for t in kesar mor gulaal; do shot home-$t -theme $t -screen home; done
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Titli"' --style compact > shots/app.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titli-ios
          path: |
            ios/shots
            ios/build.log
